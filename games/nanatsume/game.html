<title>七つ目の記憶</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one 16:9 dithered viewport with controls beneath; overlays are a black "memory" screen and a paper notebook.
   Single deliberate look: two-colour monitor palette, swappable from the notebook. */
:root{
  --ink:#333319;
  --paper:#e5ffff;
  --font:"DotGothic16","MS Gothic","Osaka-Mono",ui-monospace,monospace;
  --reserve:196px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);font-family:var(--font);
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
}
@media (hover:hover) and (pointer:fine){:root{--reserve:96px}}
button,select{font-family:var(--font)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:8px;box-sizing:border-box}
#stage{position:relative;width:min(100%, calc((100dvh - var(--reserve)) * 16 / 9));aspect-ratio:16/9;max-width:100%;outline:2px solid var(--paper);outline-offset:3px}
#view{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:grab}
.hud{position:absolute;pointer-events:none;color:var(--paper);text-shadow:1px 0 var(--ink),-1px 0 var(--ink),0 1px var(--ink),0 -1px var(--ink),1px 1px var(--ink);font-size:clamp(11px,2.2vw,16px);line-height:1.4}
#banner{top:8px;left:10px;letter-spacing:.06em;background:var(--ink);padding:4px 10px;outline:1px solid var(--paper)}
#banner b{display:block;font-weight:normal;font-size:1.25em}
#prompt{bottom:8px;left:0;right:0;text-align:center}
#prompt span{background:var(--ink);padding:2px 8px;outline:1px solid var(--paper)}
#toast{top:40%;left:8%;right:8%;text-align:center;transition:opacity .6s;opacity:0}
#toast.on{opacity:1}
#toast span{background:var(--ink);padding:4px 10px;outline:1px solid var(--paper);display:inline-block}
#flash{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .5s}
#flash.ink{background:var(--ink)}
#controls{width:min(100%, calc((100dvh - var(--reserve)) * 16 / 9));display:flex;justify-content:space-between;align-items:center;gap:12px}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-auto-rows:40px;gap:6px}
.acts{display:flex;flex-direction:column;gap:6px;min-width:0}
.keys{font-size:12px;opacity:.85;line-height:1.6;min-width:0}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media not ((hover:hover) and (pointer:fine)){.keys{display:none}}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--paper);font-size:16px;padding:6px 14px;cursor:pointer;border-radius:0}
.btn:active,.btn.on{background:var(--paper);color:var(--ink)}
.btn:focus-visible,select:focus-visible{outline:2px dashed var(--paper);outline-offset:2px}
.pad .btn{padding:0;font-size:18px}
#bAct{font-size:18px;padding:10px 18px}

.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
#title{background:var(--ink);flex-direction:column;overflow:hidden}
#title .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#title .bg canvas{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.title-inner{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--ink);padding:22px 26px;outline:2px solid var(--paper);outline-offset:-8px;max-width:100%;box-sizing:border-box}
.kicker{margin:0;letter-spacing:.4em;font-size:13px}
#title h1{margin:0;font-weight:normal;font-size:clamp(34px,8vw,64px);letter-spacing:.12em;line-height:1.1}
.sub{margin:0;font-size:14px;letter-spacing:.1em}
.title-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.small{font-size:12px;opacity:.85;margin:0;line-height:1.6}

#dialog{background:transparent;flex-direction:column;justify-content:flex-end;cursor:pointer}
.dlg-box{width:min(760px,100%);display:flex;flex-direction:row;align-items:flex-start;gap:16px;background:var(--ink);outline:2px solid var(--paper);outline-offset:-6px;padding:18px 22px;box-sizing:border-box;max-height:70%;overflow:auto}
#dlgSpk{font-size:14px;letter-spacing:.2em;min-height:1.4em}
#dlgTxt{font-size:clamp(16px,2.8vw,21px);line-height:1.7;min-height:3.4em}
#dlgTxt.narr{font-size:clamp(15px,2.5vw,18px);opacity:.88}
.dlg-main{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
#dlgFace{width:clamp(72px,17vw,124px);aspect-ratio:1;image-rendering:pixelated;outline:2px solid var(--paper);flex:none}
.opts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.opts .btn{font-size:17px;text-align:left}
.dial{display:flex;gap:8px;margin:8px 0}
.dial select{font-size:22px;padding:4px 8px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:0}
#dlgOpts:not(:empty)+.dlg-next{display:none}
.dlg-next{font-size:12px;opacity:.7;text-align:right}

.panel{background:var(--paper);color:var(--ink);width:min(640px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-sizing:border-box;outline:3px solid var(--paper);outline-offset:4px}
.panel h2{margin:0 0 10px;font-weight:normal;font-size:20px;letter-spacing:.08em;text-wrap:balance}
.panel p{line-height:1.8;margin:0 0 10px}
.panel .btn{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.panel .btn:active,.panel .btn.on{background:var(--ink);color:var(--paper)}
.panel canvas{display:block;width:100%;image-rendering:pixelated;border:2px solid var(--ink);box-sizing:border-box}
.dim{background:color-mix(in srgb,var(--ink) 82%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.letter{white-space:pre-line;line-height:1.9}

#notebook{background:var(--paper);color:var(--ink);align-items:stretch;justify-content:center;overflow:auto;padding-block:0}
.nb{width:min(980px,100%);display:flex;flex-direction:column;gap:12px;padding-block:14px 40px}
.nb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px double var(--ink);padding-bottom:10px;position:sticky;top:0;background:var(--paper);z-index:2;padding-top:4px}
.nb-head h2{margin:0;font-weight:normal;font-size:22px;letter-spacing:.1em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.nb .btn{background:var(--paper);color:var(--ink);border-color:var(--ink);font-size:14px;padding:5px 10px}
.nb .btn.on,.nb .btn:active{background:var(--ink);color:var(--paper)}
.photo-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.photo-wrap{grid-template-columns:1fr}}
.photo-wrap canvas{width:100%;image-rendering:pixelated;border:2px solid var(--ink);box-sizing:border-box;display:block}
.photo-note{font-size:13px;line-height:1.8;min-width:0}
.tally{font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{border:2px solid var(--ink);padding:10px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;position:relative;min-width:0}
.card canvas{width:72px;height:81px;image-rendering:pixelated;border:1px solid var(--ink);grid-row:span 4}
.card .no{font-size:15px;letter-spacing:.1em}
.card select{width:100%;min-width:0;font-size:13px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:0;padding:3px 2px}
.card select:disabled{opacity:1;border-style:dotted}
.card .seen{grid-column:1 / -1;font-size:11px;line-height:1.5;opacity:.85}
.stamp{position:absolute;right:8px;top:6px;border:2px solid var(--ink);padding:0 6px;transform:rotate(-8deg);font-size:14px;letter-spacing:.2em;background:var(--paper)}
.card.done{border-width:3px}
.list{display:flex;flex-direction:column;gap:12px}
.item{border-top:1px dashed var(--ink);padding-top:10px;min-width:0}
.item h3{margin:0 0 4px;font-weight:normal;font-size:17px}
.item p{margin:0;line-height:1.8;font-size:14px}
.tr{font-size:13px;line-height:1.8;margin-top:6px;padding-left:10px;border-left:3px solid var(--ink)}
.tr .s{opacity:.7}
.pals{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border:1px solid var(--ink)}
.insp{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:480px){.insp{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#flash,#toast{transition:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="view" width="384" height="216" aria-label="旧校舎の一人称視点"></canvas>
    <div id="banner" class="hud" hidden></div>
    <div id="toast" class="hud"><span></span></div>
    <div id="prompt" class="hud" hidden><span></span></div>
    <div id="flash"></div>
  </div>
  <div id="controls">
    <div class="pad" aria-label="移動">
      <button class="btn" data-k="tl" aria-label="左を向く">↺</button>
      <button class="btn" data-k="f" aria-label="前へ">▲</button>
      <button class="btn" data-k="tr" aria-label="右を向く">↻</button>
      <button class="btn" data-k="sl" aria-label="左へ">◁</button>
      <button class="btn" data-k="b" aria-label="後ろへ">▼</button>
      <button class="btn" data-k="sr" aria-label="右へ">▷</button>
      <button class="btn" data-k="lu" aria-label="上を見る">⤒</button>
      <button class="btn" data-k="lc" aria-label="正面を見る">◎</button>
      <button class="btn" data-k="ld" aria-label="下を見る">⤓</button>
    </div>
    <div class="keys">W / S ・ ↑ / ↓ ─ 前後　A / D ─ 横歩き　← / → ─ 向き　R / F ─ 上 / 下を見る　ドラッグ ─ 見回す<br>E ・ Space ─ 調べる / 話す　N ─ 手帳　1〜9 ─ 選択肢</div>
    <div class="acts">
      <button class="btn" id="bAct">調べる・話す</button>
      <button class="btn" id="bNote">手帳</button>
    </div>
  </div>
</div>

<div id="title" class="ov">
  <div class="bg" id="titleBg"></div>
  <div class="title-inner">
    <p class="kicker">夕霧中学校 旧校舎</p>
    <h1>七つ目の記憶</h1>
    <p class="sub">昭和五十四年　文化祭前夜の怪談</p>
    <div class="title-btns">
      <button class="btn" id="btnNew">はじめから</button>
      <button class="btn" id="btnCont" hidden>つづきから</button>
    </div>
    <p class="small">音が出ます。ヘッドホン推奨。</p>
  </div>
</div>

<div id="dialog" class="ov" hidden>
  <div class="dlg-box">
    <canvas id="dlgFace" hidden></canvas>
    <div class="dlg-main">
    <div id="dlgSpk"></div>
    <div id="dlgTxt"></div>
    <div id="dlgOpts" class="opts"></div>
    <div class="dlg-next">▼ タップ / Space</div>
    </div>
  </div>
</div>

<div id="msg" class="ov dim" hidden>
  <div class="panel" role="dialog" aria-modal="true">
    <h2 id="msgT"></h2>
    <div id="msgB"></div>
    <div class="row"><button class="btn" id="msgOk">閉じる</button></div>
  </div>
</div>

<div id="notebook" class="ov" hidden>
  <div class="nb">
    <div class="nb-head">
      <h2>取材手帳</h2>
      <div class="tabs" id="nbTabs"></div>
      <button class="btn" id="nbClose">閉じる</button>
    </div>
    <div id="nbBody"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const D2R=Math.PI/180, TAU=Math.PI*2;
const W=384,H=216,HALF=H/2;
const FOV=66*D2R, PLANE=Math.tan(FOV/2), PROJ=(W/2)/PLANE;
const WALLH=3.0, EYE=1.5;
const KEY='nanatsume-v3';

/* ---------- palettes (two-colour monitors) ---------- */
const PALS=[
  {id:'mac',name:'Macintosh',ink:'#333319',paper:'#e5ffff'},
  {id:'ibm8503',name:'IBM 8503',ink:'#2e3037',paper:'#ebe5ce'},
  {id:'c1084',name:'Commodore 1084',ink:'#40318e',paper:'#88d7de'},
  {id:'ibm5151',name:'IBM 5151',ink:'#25342f',paper:'#01eb5f'},
  {id:'zenith',name:'Zenith ZVM 1240',ink:'#3f291e',paper:'#fdca55'},
  {id:'sepia',name:'古写真',ink:'#2b1d14',paper:'#e8d8b8'},
];
let PAL=PALS[0],INK32=0,PAP32=0;
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function setPal(p){
  PAL=p;const a=hexRGB(p.ink),b=hexRGB(p.paper);
  INK32=((255<<24)|(a[2]<<16)|(a[1]<<8)|a[0])>>>0;
  PAP32=((255<<24)|(b[2]<<16)|(b[1]<<8)|b[0])>>>0;
  const r=document.documentElement.style;r.setProperty('--ink',p.ink);r.setProperty('--paper',p.paper);
  repaintUI();
}
const BAYER=(()=>{const m=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];return Float32Array.from(m,v=>(v+.5)/64);})();

/* ---------- helpers ---------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function gray(v){const n=Math.max(0,Math.min(255,Math.round(v*255)));return `rgb(${n},${n},${n})`;}
function lumOf(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,n=c.width*c.height,l=new Float32Array(n),a=new Uint8Array(n);for(let i=0;i<n;i++){l[i]=d[i*4]/255;a[i]=d[i*4+3]>127?1:0;}return {w:c.width,h:c.height,l,a};}
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function hash(a,b){const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);}
function speckle(g,w,h,amt,n){for(let i=0;i<n;i++){const v=rnd()>.5?255:0;g.fillStyle=`rgba(${v},${v},${v},${amt*rnd()})`;g.fillRect(rnd()*w|0,rnd()*h|0,1+(rnd()*2|0),1+(rnd()*2|0));}}
function ell(g,x,y,rx,ry,col,stroke){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=gray(col);g.fill();if(stroke){g.lineWidth=1.2;g.strokeStyle=gray(.04);g.stroke();}}
function poly(g,pts,col,lw=1.5){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fillStyle=gray(col);g.fill();if(lw){g.lineWidth=lw;g.strokeStyle=gray(.04);g.stroke();}}
function seg(g,p,q,w,col){g.lineCap='round';g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.strokeStyle=gray(.04);g.lineWidth=w+3;g.stroke();g.strokeStyle=gray(col);g.lineWidth=w;g.stroke();}
const vec=(a,l)=>[Math.sin(a*D2R)*l,Math.cos(a*D2R)*l];
const addv=(p,q,k=1)=>[p[0]+q[0]*k,p[1]+q[1]*k];

/* UI images are kept as grey sources and re-dithered whenever the palette changes */
const uiReg=[];
function ditherInto(dst,src){
  const w=src.width,h=src.height;dst.width=w;dst.height=h;
  const sd=src.getContext('2d').getImageData(0,0,w,h).data,g=dst.getContext('2d'),id=g.createImageData(w,h),o=new Uint32Array(id.data.buffer);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,l=sd[i*4+3]<128?1:sd[i*4]/255;o[i]=l>BAYER[(y&7)*8+(x&7)]?PAP32:INK32;}
  g.putImageData(id,0,0);
}
function uiCanvas(src){const c=document.createElement('canvas');ditherInto(c,src);uiReg.push({c,src});return c;}
function repaintUI(){for(let i=uiReg.length-1;i>=0;i--){const r=uiReg[i];if(!r.c.isConnected&&i<uiReg.length-40){uiReg.splice(i,1);continue;}ditherInto(r.c,r.src);}}

/* ---------- people of 1979 ---------- */
const PEOPLE={
  tachibana:{no:1,name:'橘 伸二',role:'二年',outfit:'gaku',hair:'side',h:1.6},
  tachi99:  {no:8,name:'橘 伸二',role:'宿直の教師',outfit:'suit',hair:'side',h:1.72},
  kashiwagi:{no:2,name:'柏木 正',role:'理科教諭',outfit:'coat',hair:'side',h:1.7},
  kuroda:   {no:3,name:'黒田 恭介',role:'三年・生徒会長',outfit:'gaku',hair:'side',h:1.74},
  kaoru:    {no:4,name:'鈴原 カオル',role:'三年・水泳部',outfit:'jersey',hair:'side',h:1.66},
  sumiko:   {no:5,name:'白石 澄子',role:'二年・吹奏楽部',outfit:'blazer',hair:'bob',h:1.58},
  harumi:   {no:6,name:'森 ハルミ',role:'二年',outfit:'sailor',hair:'braids',h:1.52},
  toru:     {no:7,name:'早瀬 透',role:'一年・写真部',outfit:'gaku',hair:'buzz',h:1.62},
};
const PIDS=['tachibana','kashiwagi','kuroda','kaoru','sumiko','harumi','toru'];
/* ---------- drawing people ---------- */
function drawHead(g,pid,back){
  const hs=PEOPLE[pid].hair;
  if(back){
    ell(g,-10,1,2,3,.68,true);ell(g,10,1,2,3,.68,true);
    ell(g,0,0,9.6,11.5,.7,true);
    g.save();g.beginPath();g.ellipse(0,0,9.6,11.5,0,0,TAU);g.clip();g.fillStyle=gray(.14);g.fillRect(-11,-1,22,9);g.restore();
    ell(g,-3,-7,3,1.6,.95,false);return;
  }
  if(hs==='long'){g.beginPath();g.moveTo(-11,-5);g.quadraticCurveTo(-15,16,-13,27);g.lineTo(13,27);g.quadraticCurveTo(15,16,11,-5);g.closePath();g.fillStyle=gray(.06);g.fill();}
  if(hs==='braids'){for(const s of[-1,1]){for(let i=0;i<5;i++)ell(g,s*10.8,4+i*4.4,3.1,2.8,.08,true);ell(g,s*10.8,26,2.6,2.2,.92,true);}}
  ell(g,-10,1,2,3,.68,true);ell(g,10,1,2,3,.68,true);
  ell(g,0,0,9.6,11.5,.74,true);
  g.fillStyle=gray(.06);
  if(hs==='side'){g.beginPath();g.moveTo(-10.2,1);g.quadraticCurveTo(-11.5,-12.5,0,-12.8);g.quadraticCurveTo(11.5,-12.5,10.2,1);g.quadraticCurveTo(8,-6,1,-6.5);g.quadraticCurveTo(-6,-7.5,-10.2,1);g.fill();g.strokeStyle=gray(.6);g.lineWidth=1;g.beginPath();g.moveTo(-3.5,-12.5);g.lineTo(-4.5,-7);g.stroke();}

function wallTex(ch,prev){
  switch(ch){
    case '#':return prev==='t'?TX.tile:(prev==='c'?TX.concrete:(prev==='r'?TX.fence:TX.wall));
    case 'W':return TX.window;case 'B':return TX.board;case 'K':return TX.shelf;case 'L':return TX.locker;
    case 'P':return TX.stall;case 'F':return TX.fence;case 'D':return TX.door;case 'E':return TX.ironDoor;
    default:return TX['sign'+ch]||TX.wall;
  }
}

/* ---------- renderer ---------- */
const cv=$('#view'),cx=cv.getContext('2d'),IMG=cx.createImageData(W,H),OUT32=new Uint32Array(IMG.data.buffer);
const SURF=new Int32Array(W*H),DEPTH=new Float32Array(W*H),LUM=new Float32Array(W*H),ZB=new Float32Array(W),WT=new Float32Array(W),WB=new Float32Array(W);
const COLCAM=new Float32Array(W),COLANG=new Float32Array(W),SEC=new Float32Array(W),CONE=new Float32Array(W*H),VIG=new Float32Array(W*H);
for(let x=0;x<W;x++){COLCAM[x]=2*(x+.5)/W-1;COLANG[x]=Math.atan(COLCAM[x]*PLANE);SEC[x]=Math.sqrt(1+COLCAM[x]*COLCAM[x]*PLANE*PLANE);}
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(x-W/2)/(W/2),dy=(y-HALF)/HALF,i=y*W+x;VIG[i]=1-.42*Math.pow(Math.min(1,(dx*dx+dy*dy)/2),1.5);
  let c=1-((dx/1.0)**2+((y-HALF-4)/(H*.8))**2);c=Math.max(0,Math.min(1,c));CONE[i]=c*c*(3-2*c);}
const MOONA=-2.3;
function skyAt(x,y){
  y+=Math.round(PIT);
  const ang=pa+COLANG[x];
  if(MODE==='memory'&&MEM.sky==='dawn'){const t=y/HALF;return .16+.5*t*t+(hash(Math.floor(((ang%TAU)+TAU)%TAU*60),y>>2)>.97?.04:0);}
  const base=(MODE==='memory'?.07:.03)+.07*(y/HALF)*(y/HALF);
  let da=ang-MOONA;da=Math.atan2(Math.sin(da),Math.cos(da));const mx=da*PROJ,my=y-34,r2=mx*mx+my*my;
  if(r2<121)return r2<64&&mx>2?.7:.96;if(r2<500)return base+.1*(1-r2/500);
  if(hash(Math.floor(((ang%TAU)+TAU)%TAU*170),y)>.992)return .85;
  return base;
}
let SPR=[],SOLIDS=[],TR_ACTIVE=[],PIT=14;
function lightPix(wx,wy,d,i,outdoor){
  if(MODE==='present')return Math.min(1.08,(outdoor?.09:.02)+1.7*CONE[i]/(1+d*d*.05));
  let L=MEM.amb*1.6+.08;for(const l of MEM.lights){const dx=wx-l[0],dy=wy-l[1];L+=l[2]*1.4/(1+(dx*dx+dy*dy)*.25);}return L/(1+d*.02);
}
function render(){
  const HZ=HALF-Math.round(PIT);
  const dirX=Math.cos(pa),dirY=Math.sin(pa),plX=-dirY*PLANE,plY=dirX*PLANE;
  const cx0=Math.floor(px),cy0=Math.floor(py),mem=MODE==='memory',eyeZ=EYE+eyeH,T0=mem?0:TIME;
  const floorPix=(i,x,y,cc,h,rdx,rdy)=>{
    const dist=(eyeZ-h)*PROJ/(y+.5-HZ),fx=px+rdx*dist,fy=py+rdy*dist,ix=Math.floor(fx),iy=Math.floor(fy),d=dist*SEC[x];
    DEPTH[i]=dist;SURF[i]=4096+iy*MW+ix;
    if(cc==='v'){LUM[i]=mem?.06*MEM.amb*8:(hash(Math.floor(fx*2),Math.floor(fy*2))>.96?.9:.015);SURF[i]=0;return;}
    let alb;
    if(cc==='p'){const w=Math.sin(fx*4.2+T0*1.6+Math.sin(fy*2.7+T0*.9))*Math.sin(fy*5.1-T0*1.2);alb=.13+.07*w;if(w>.82)alb=.55;}
    else{const t=cc==='t'?TX.ftile:cc==='c'?TX.fconc:cc==='r'?TX.froof:cc==='s'?TX.tread:TX.wood;alb=t.l[(((fy-iy)*64)|0)*64+(((fx-ix)*64)|0)];}
    if(!mem){for(let k=0;k<TR_ACTIVE.length;k++){const tr=TR_ACTIVE[k],dx=fx-tr.x,dy=fy-tr.y,r2=dx*dx+dy*dy;if(r2<.3){const a=Math.atan2(dy,dx),rr=.36+.12*Math.sin(a*5+tr.x)+.05*Math.sin(a*13);if(r2<rr*rr)alb*=.08+.25*hash(Math.floor(fx*24),Math.floor(fy*24));}}}
    LUM[i]=alb*lightPix(fx,fy,d,i,OUTDOOR.indexOf(cc)>=0);
  };
  for(let x=0;x<W;x++){
    const cam=COLCAM[x],rdx=dirX+plX*cam,rdy=dirY+plY*cam;
    let mx=cx0,my=cy0;const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let sx,sy,sdx,sdy;
    if(rdx<0){sx=-1;sdx=(px-mx)*ddx;}else{sx=1;sdx=(mx+1-px)*ddx;}
    if(rdy<0){sy=-1;sdy=(py-my)*ddy;}else{sy=1;sdy=(my+1-py)*ddy;}
    let cT=0,cB=H,cc=cellAt(mx,my),cfh=fhAt(mx,my),cch=chAt(mx,my);
    for(let n=0;n<96&&cT<cB;n++){
      let d,side;
      if(sdx<sdy){d=sdx;sdx+=ddx;mx+=sx;side=0;}else{d=sdy;sdy+=ddy;my+=sy;side=1;}
      const sc=PROJ/d,yAt=z=>HZ+(eyeZ-z)*sc;
      // floor of the current cell
      if(eyeZ>cfh){const ys=Math.max(cT,Math.ceil(yAt(cfh)));for(let y=ys;y<cB;y++)floorPix(y*W+x,x,y,cc,cfh,rdx,rdy);cB=Math.max(cT,Math.min(cB,ys));}
      // ceiling of the current cell
      if(cch<1e8&&eyeZ<cch){const ye=Math.min(cB,Math.ceil(yAt(cch)));for(let y=cT;y<ye;y++){const i=y*W+x,dist=(cch-eyeZ)*PROJ/(HZ-y-.5),fx=px+rdx*dist,fy=py+rdy*dist,t=TX.ceil;
          LUM[i]=t.l[(((fy*.5-Math.floor(fy*.5))*64)|0)*64+(((fx*.5-Math.floor(fx*.5))*64)|0)]*lightPix(fx,fy,dist*SEC[x],i,false);DEPTH[i]=dist;SURF[i]=8192+Math.floor(fy)*MW+Math.floor(fx);}
        cT=Math.max(cT,ye);}
      if(cT>=cB||mx<0||my<0||mx>=MW||my>=MH)break;
      const nc=G[my][mx],hx=px+rdx*d,hy=py+rdy*d,dl=d*SEC[x],outdoor=OUTDOOR.indexOf(cc)>=0,cid=my*MW+mx;
      let u=side===0?hy:hx;u-=Math.floor(u);if(side===0&&rdx<0)u=1-u;if(side===1&&rdy>0)u=1-u;
      const shade=side===1?.82:1,colL=mem?lightPix(hx,hy,dl,0,outdoor):0;
      const face=(z0,z1,tex,vfn,type)=>{const ya=Math.max(cT,Math.ceil(yAt(z1))),yb=Math.min(cB,Math.ceil(yAt(z0))),tx=Math.min(tex.w-1,(u*tex.w)|0);
        for(let y=ya;y<yb;y++){const i=y*W+x,z=eyeZ-(y+.5-HZ)/sc,ty=Math.max(0,Math.min(tex.h-1,(vfn(z)*tex.h)|0));LUM[i]=tex.l[ty*tex.w+tx]*shade*(mem?colL:lightPix(0,0,dl,i,outdoor));DEPTH[i]=d;SURF[i]=type*4096+cid;}
        return [ya,yb];};
      const wallV=z=>{let t=z-cfh;if(t>3)t=1.6+((t-3)%1.4);return (3-t)/3;};
      if(OPEN.indexOf(nc)<0){const r=face(WBOT[my][mx],WTOP[my][mx],wallTex(nc,cc),wallV,3);for(let y=cT;y<r[0];y++){const i=y*W+x;LUM[i]=y<HZ?skyAt(x,y):.015;DEPTH[i]=1e9;SURF[i]=0;}cT=Math.max(cT,r[1]);break;}
      const nfh=fhAt(mx,my),nch=chAt(mx,my);
      if(nfh>cfh){face(cfh,nfh,TX.riser,z=>(nfh-z)/(nfh-cfh),5);cB=Math.max(cT,Math.min(cB,Math.ceil(yAt(nfh))));}
      if(nch<cch){
        if(cch<1e8){face(nch,cch,TX.wall,wallV,3);}
        else{const r=face(nch,nch+.7,TX.concrete,z=>.2+(nch+.7-z)*.3,3);for(let y=cT;y<r[0];y++){const i=y*W+x;LUM[i]=skyAt(x,y);DEPTH[i]=1e9;SURF[i]=0;}}
        cT=Math.min(cB,Math.max(cT,Math.ceil(yAt(nch))));
      }
      cc=nc;cfh=nfh;cch=nch;
    }
    for(let y=cT;y<cB;y++){const i=y*W+x;LUM[i]=y<HZ?skyAt(x,y):.015;DEPTH[i]=1e9;SURF[i]=0;}
  }
  // sprites
  const list=[];
  for(const s of SPR){const dx=s.x-px,dy=s.y-py,dep=dx*dirX+dy*dirY;if(dep<.12)continue;list.push([s,dep,dx*(-dirY)+dy*dirX]);}
  list.sort((a,b)=>b[1]-a[1]);
  let sid=0;const gph=Math.floor(TIME*9)%97;
  for(const [s,dep,lat] of list){
    sid++;const img=s.img,sc=PROJ/dep,scx=W/2*(1+(lat/dep)/PLANE),zb=s.z+fhAt(Math.floor(s.x),Math.floor(s.y));
    const sw=img.w/100*sc,x0=scx-sw/2,top=HZ+(eyeZ-(zb+img.h/100))*sc,bot=HZ+(eyeZ-zb)*sc,sh=bot-top;
    const xa=Math.max(0,Math.ceil(x0)),xb=Math.min(W,Math.ceil(x0+sw)),ya=Math.max(0,Math.ceil(top)),yb=Math.min(H,Math.ceil(bot));

    for(let x=xa;x<xb;x++){
      const tx=Math.min(img.w-1,(((x+.5-x0)/sw)*img.w)|0);
      for(let y=ya;y<yb;y++){const i=y*W+x;if(dep>=DEPTH[i])continue;const ty=Math.min(img.h-1,(((y+.5-top)/sh)*img.h)|0),j=ty*img.w+tx;if(!img.a[j])continue;
        if(s.ghost&&hash(x+gph,y*.37+gph)<.32)continue;

}

function canStand(x,y,ox,oy){
  const r=.22,h0=fhAt(Math.floor(ox),Math.floor(oy));
  for(const [cx_,cy_] of [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]]){if(solidCell(cx_,cy_))return false;if(fhAt(Math.floor(cx_),Math.floor(cy_))>h0+.55)return false;}

}
let stepAcc=0,eyeH=0,modelT=0,lastPiano=-99,poolBusy=false;
const seenArea={};
function areaHint(id,cond,text){if(!seenArea[id]&&cond){seenArea[id]=1;toast(text);return true;}return false;}
function update(dt){

/* ---------- audio ---------- */
let AC=null,master=null,drone=null;
function initAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
const NB={};
function nbuf(d){const k=Math.round(d*20);if(NB[k])return NB[k];const n=Math.max(1,Math.floor(AC.sampleRate*d)),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;return NB[k]=b;}
function nz(t,d,type,freq,vol){const s=AC.createBufferSource();s.buffer=nbuf(d);const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);}
function tone(t,f,d,vol,type='triangle'){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
function sfx(n){
  if(!AC)return;const t=AC.currentTime+.02;
  switch(n){
    case 'shutter':nz(t,.05,'highpass',2500,.5);nz(t+.08,.06,'highpass',1700,.4);break;
    case 'moonlight':{const tri=[207.65,277.18,329.63];let k=0;for(let r=0;r<4;r++)for(let j=0;j<3;j++){tone(t+k*.3,tri[j],1.3,.11);k++;}tone(t,69.3,3.6,.12);tone(t,138.59,3.6,.09);break;}
    case 'crash':[65.4,98,123.5,146.8,185,220,246.9,311.1].forEach((f,i)=>tone(t+i*.004,f,2.6,.08));nz(t,.15,'lowpass',400,.5);break;
    case 'drag':nz(t,1.8,'bandpass',300,.3);break;
    case 'knock':for(let i=0;i<3;i++){tone(t+i*.38,140,.12,.35,'sine');nz(t+i*.38,.05,'bandpass',900,.3);}break;
    case 'steps':for(let i=0;i<8;i++)nz(t+i*.16,.06,'bandpass',500,.25);break;

const FACE={},FACEG={};
const SPK={'少女':'sumiko','少年':'toru','男子生徒':'kuroda','白衣の男':'kashiwagi','中年の男の声':'kashiwagi','橘':'tachibana','宿直の先生':'tachibana','か細い声':'harumi'};
function loadFaces(){return Promise.all(Object.entries(FACE_SRC).map(([k,src])=>new Promise(res=>{const im=new Image();im.onload=()=>{
  const c=mk(120,120),g=c.getContext('2d');g.drawImage(im,0,0,120,120);FACE[k]=c;
  const q=mk(120,120),h=q.getContext('2d');h.drawImage(im,0,0,120,120);const d=h.getImageData(0,0,120,120),a=d.data;
  for(let y=0;y<120;y++){const sh=(y%3===0)?.18:0;for(let x=0;x<120;x++){const i=(y*120+x)*4;let v=a[i]/255;v=.25+v*.7+sh+(hash(x,y)-.5)*.12;const n=Math.max(0,Math.min(255,v*255));a[i]=a[i+1]=a[i+2]=n;}}
  h.putImageData(d,0,0);FACEG[k]=q;res();};im.onerror=res;im.src=src;})));}
function setFace(spk){const c=$('#dlgFace'),pid=SPK[spk];if(!pid||!FACE[pid]){c.hidden=true;return;}ditherInto(c,pid==='tachibana'?FACE[pid]:FACEG[pid]);c.hidden=false;}
let PHOTO=null,TITLE=null;
function buildPhoto(){
  seed=3;const c=mk(320,200),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,200);gr.addColorStop(0,gray(.62));gr.addColorStop(1,gray(.4));g.fillStyle=gr;g.fillRect(0,0,320,200);
  g.fillStyle=gray(.9);g.fillRect(70,6,180,22);g.strokeStyle=gray(.1);g.lineWidth=2;g.strokeRect(70,6,180,22);
  g.font='15px DotGothic16, sans-serif';g.fillStyle=gray(0);g.textAlign='center';g.textBaseline='middle';g.fillText('文化祭実行委員会',160,18);
  const back=['kashiwagi','kuroda','kaoru'],front=['tachibana','sumiko','harumi','toru'];
  back.forEach((p,i)=>{if(FACE[p])g.drawImage(FACE[p],46+i*76,34,72,72);g.strokeStyle=gray(.15);g.strokeRect(46+i*76,34,72,72);});
  front.forEach((p,i)=>{if(FACE[p])g.drawImage(FACE[p],8+i*76,114,72,72);g.strokeStyle=gray(.15);g.strokeRect(8+i*76,114,72,72);});
  speckle(g,320,200,.3,900);
  const v=g.createRadialGradient(160,100,60,160,100,200);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=v;g.fillRect(0,0,320,200);
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.beginPath();g.moveTo(250,0);g.lineTo(214,200);g.stroke();
  PHOTO=c;
}

addEventListener('keydown',e=>{
  if(!$('#dialog').hidden){
    if(asking){const m=/^Digit([1-9])$/.exec(e.code);if(m){const b=$('#dlgOpts').querySelectorAll('button')[+m[1]-1];if(b){e.preventDefault();b.click();}}return;}
    if(['Space','Enter','KeyE'].includes(e.code)){e.preventDefault();nextLine();}return;}
  if(!$('#msg').hidden){if(['Escape'].includes(e.code)||(['Space','Enter','KeyE'].includes(e.code)&&!(document.activeElement&&document.activeElement.tagName==='SELECT'))){e.preventDefault();closeMsg();}return;}
  if(!$('#notebook').hidden){if(e.code==='Escape'||e.code==='KeyN'){e.preventDefault();closeNotebook();}return;}
  if(!started)return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','PageUp','PageDown'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter')action();
  if(e.code==='KeyN'||e.code==='Tab'){e.preventDefault();openNotebook();}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
