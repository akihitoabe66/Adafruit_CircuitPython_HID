<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>UIデザイン案(見本)</title>
<style>
/* 1920×1080 の固定画面。?v=a(右の列なし・手牌いっぱい) / ?v=b(右に直通キーの列) */
:root { --felt1: #1c6b4a; --felt2: #0f3f2c; --cream: #fff6dd; --ink: #2a1c0e; --gold: #f2b632; --gold2: #b57a0b; --purple: #4a1a78; --purple2: #7b3fc4; --red: #d8342a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; font-family: "Noto Sans CJK JP", "Noto Sans JP", "IPAGothic", sans-serif; background: #000; }
#st { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, var(--felt1), var(--felt2) 78%); }
#st::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #ffffff06 0 3px, transparent 3px 7px); }
.abs { position: absolute; }
.tile { position: absolute; background-size: 100% 100%; filter: drop-shadow(0 3px 2px #0007); }
.back { position: absolute; background: linear-gradient(180deg, #5a7fd6, #2f4d9c); border-radius: 4px; border-bottom: 4px solid #1c2f6b; }
.btn { position: absolute; display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(180deg, #fffaf0, var(--cream)); color: var(--ink); border: 4px solid var(--gold2); border-radius: 18px; font-weight: 900; box-shadow: 0 6px 0 #6b470866, 0 8px 14px #0006; }
.btn .key { background: var(--ink); color: #ffe7a0; border-radius: 10px; padding: 2px 12px; font-size: 30px; font-weight: 900; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.face { width: 168px; height: 168px; border-radius: 22px; border: 6px solid var(--gold); background-size: cover; box-shadow: 0 0 0 4px var(--purple), 0 8px 18px #000a; }
.plate { min-width: 230px; padding: 6px 18px; text-align: center; background: linear-gradient(180deg, var(--purple2), var(--purple)); border: 4px solid var(--gold); border-radius: 16px; color: #fff; box-shadow: 0 5px 12px #0008; }
.plate b { display: block; font-size: 34px; letter-spacing: .06em; }
.plate span { font-size: 32px; color: #ffe7a0; font-weight: 900; }
.plate small { font-size: 22px; color: #e8d8ff; margin-right: 8px; }
.wind { display: inline-block; width: 40px; height: 40px; line-height: 40px; border-radius: 10px; background: var(--ink); color: #ffe7a0; margin-right: 8px; font-size: 28px; }
.center { position: absolute; width: 400px; height: 230px; background: #0b2c1fdd; border: 5px solid #cbb26a; border-radius: 22px; color: #fff; text-align: center; box-shadow: inset 0 0 30px #000a; }
.center .k { font-size: 56px; font-weight: 900; margin-top: 16px; }
.center .z { font-size: 40px; margin-top: 8px; } .center .z b { font-size: 76px; color: #ffe066; }
.center .dr { margin-top: 6px; font-size: 28px; color: #cfe; }
.help { position: absolute; padding: 14px 26px; background: #fffbe8; border: 4px solid var(--gold2); border-radius: 22px; color: var(--ink); font-size: 36px; font-weight: 800; box-shadow: 0 6px 14px #0007; }
.callb { position: absolute; display: flex; align-items: center; justify-content: center; gap: 14px; border-radius: 22px; font-weight: 900; font-size: 56px; border: 6px solid #fff; box-shadow: 0 8px 0 #0005, 0 12px 20px #0007; }
.corner { position: absolute; font-weight: 900; color: #fff; text-shadow: 0 3px 6px #000; }
</style></head>
<body>
<div id="st"></div>
<script>
const V = new URLSearchParams(location.search).get('v') || 'a';
const EV = V === 'e', RS = V === 'r';          // e=ロン・ポンなどの席ごとの呼び出し(?v=e&seat=right&w=ロン) r=局の結果(席ごとの札)
const B = V === 'b', C = V === 'c', D = V === 'd' || EV || RS;   // D = Bの配置(右の列は画面の高さいっぱい)+Cの色・文字・Fキーの札
const W = B ? 1620 : (C || D) ? 1600 : 1920;      // 盤面の幅(Bは右に300pxの列。Cは右に320pxの列(手牌の高さまで)で、手牌は画面いっぱい)
const CX = W / 2;
const st = document.getElementById('st');
const el = (cls, style, html) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, style); if (html != null) d.innerHTML = html; st.appendChild(d); return d; };
const tile = (id, x, y, w, parent, rot, red) => { const h = Math.round(w * 138 / 104); const t = document.createElement('div'); t.className = 'tile'; Object.assign(t.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', backgroundImage: `url(../../img/tiles/${red ? 'r' : ''}${id}.webp)`, transform: rot ? `rotate(${rot}deg)` : '' }); (parent || st).appendChild(t); return t; };
const face = (n) => `url(../../img/chars/${String(n).padStart(2, '0')}.webp)`;

/* --- 席の札(顔+名前+点数) --- */
const seat = (x, y, n, name, wind, pts) => el('seat', { left: x + 'px', top: y + 'px' }, `<div class="face" style="background-image:${face(n)}"></div><div class="plate"><b><span class="wind">${wind}</span>${name}</b><span>${pts}</span></div>`);

/* --- 河(捨て牌): 6列×2段。席ごとに回転して置く --- */
const river = (cx, cy, rot, ids) => { const box = el('abs', { left: (cx - 170) + 'px', top: (cy - 75) + 'px', width: '340px', height: '150px', transform: `rotate(${rot}deg)` }); ids.forEach((id, i) => { const c = i % 6, r = Math.floor(i / 6); tile(id, c * 56, r * 74, 54, box, 0, id === 13 && false); }); return box; };
const RIV = { own: [32, 5, 27, 19, 9, 14, 30, 8, 22, 28, 1, 25], top: [27, 33, 10, 3, 24, 31, 0, 17, 29, 12], left: [30, 4, 21, 16, 28, 33, 7, 26], right: [31, 2, 23, 15, 27, 8, 18, 32, 6] };

/* --- 盤面 --- */
river(CX, 655, 0, RIV.own); river(CX, 255, 180, RIV.top); river(CX - 290, 460, 90, RIV.left); river(CX + 290, 460, -90, RIV.right);
const c = el('center', { left: (CX - 200) + 'px', top: '345px' }, `<div class="k">東一局</div><div class="z">残り <b>66</b> 枚</div><div class="dr">ドラ表示 ➜ </div>`);
tile(12, 255, 154, 40, c, 0);                                   // ドラ表示牌(4筒)
// 相手の手牌(伏せ牌)
for (let i = 0; i < 13; i++) { const b = el('back', { left: (CX - 330 + i * 51) + 'px', top: '10px', width: '46px', height: '64px' }); }
for (let i = 0; i < 9; i++) { el('back', { left: '24px', top: (330 + i * 44) + 'px', width: '64px', height: '40px' }); el('back', { left: (W - 88) + 'px', top: (330 + i * 44) + 'px', width: '64px', height: '40px' }); }
// 顔と名前(3人は新キャラ。「あなた」は顔の絵がまだ無い)
seat(CX + 340, 24, 28, 'ナオミ', '北', '25,000');
seat(110, 400, 34, 'ショウ', '東', '25,000');
seat(W - 110 - 230, 400, 18, '源造', '西', '25,000');
el('seat', { left: '40px', top: '768px' }, `<div class="plate" style="min-width:260px"><b><span class="wind">南</span>あなた</b><span>25,000</span></div>`);

/* --- 手牌(14枚+ツモ牌)と ★おすすめ --- */
const HW = D ? 108 : B ? 106 : 122, GAP = (B || D) ? 3 : 4;
const hand = [0, 1, 2, 3, 4, 5, 6, 11, 12, 13, 20, 21, 27];
const total = 14 * HW + 13 * GAP + 26;
let x0 = Math.round(((B || D) ? (W - total) / 2 : (1920 - total) / 2)), HY = (B || D) ? 900 : 880;
hand.forEach((id, i) => tile(id, x0 + i * (HW + GAP), HY, HW, null, 0, id === 13));
tile(22, x0 + 13 * (HW + GAP) + 26, HY - 12, HW, null, 0, false);
el('corner', { left: (x0 + 13 * (HW + GAP) + 26 + HW / 2 - 24) + 'px', top: (HY - 62) + 'px', fontSize: '48px', color: '#ffd23f' }, '★');
// 先生のひとこと
if (!EV && !RS) el('help', { left: '30px', top: ((B || C || D) ? 24 : 196) + 'px', width: '430px', lineHeight: '1.3' }, '🎓 先生<br><span style="font-weight:600"><b>5索</b> を切ると、<br>テンパイに近づきます</span>');

/* --- 鳴きの確認(大きなボタン) --- */
const cb1 = (EV || RS) ? null : el('callb', { left: (CX - 440) + 'px', top: '745px', width: '460px', height: '120px', background: 'linear-gradient(180deg,#ffd45c,#e69a10)', color: '#2a1c0e' }, 'ポン');
if (cb1) { cb1.innerHTML = '<span style="margin-right:190px">ポン</span>';
tile(27, 250, 20, 56, cb1); tile(27, 308, 20, 56, cb1); tile(27, 366, 20, 56, cb1); }
const cb2 = (EV || RS) ? null : el('callb', { left: (CX + 60) + 'px', top: '745px', width: '280px', height: '120px', background: 'linear-gradient(180deg,#7fb2ff,#3c78d8)', color: '#fff' }, '見送る');

if (!B && !C && !D) {
  // 案A: 右の列なし。隅にだけ、大きめのボタン
  el('btn', { left: '30px', top: '24px', width: '210px', height: '78px', fontSize: '38px' }, '☰ メニュー');
  el('btn', { left: '256px', top: '24px', width: '210px', height: '78px', fontSize: '38px' }, '⚙ せってい');
  el('corner', { right: '40px', top: '16px', fontSize: '60px', textAlign: 'right', lineHeight: '1.1' }, '東風戦<br>東一局');
  el('btn', { left: '30px', top: '116px', width: '436px', height: '64px', fontSize: '30px', background: 'linear-gradient(180deg,#e9e9e9,#cfcfcf)' }, '鳴きを自動で見送る：<b style="color:#b00">OFF</b>');
} else if (B) {
  // 案B: 右に直通キーの列(各ボタンに、キーボードのキーを表示)
  el('abs', { left: '1620px', top: '0', width: '300px', height: '1080px', background: 'linear-gradient(180deg,#2c2438,#1a1424)', borderLeft: '6px solid var(--gold2)' });
  el('corner', { left: '1650px', top: '18px', fontSize: '52px', lineHeight: '1.1' }, '東風戦<br>東一局');
  const rows = [['F1', 'メニュー'], ['F2', '先生<br><small style="font-size:26px">あり / なし</small>'], ['F3', '鳴きを<br><small style="font-size:26px">自動で見送る</small>'], ['F4', '手牌を<br><small style="font-size:26px">ならべる</small>'], ['F5', 'せってい']];
  rows.forEach((r, i) => el('btn', { left: '1636px', top: (170 + i * 138) + 'px', width: '268px', height: '122px', fontSize: '38px', lineHeight: '1.15', textAlign: 'center' }, `<span class="key">${r[0]}</span><span>${r[1]}</span>`));
  el('corner', { left: '1640px', top: '880px', width: '270px', fontSize: '22px', lineHeight: '1.4', fontWeight: 700, color: '#d8ccf0', textShadow: 'none' }, 'キーボードの F1〜F5 でも押せます。<br>画面のボタンをクリックしてもOK。');
}
if (C || D) {
  // 案C/D: 右の列は盤面の高さまで(手牌の行は画面いっぱい)。キーの札は同じ幅・同じ位置にそろえ、文字は大きく、色は用途ごとに濃く
  el('abs', { left: '1600px', top: '0', width: '320px', height: (D ? 1080 : 804) + 'px', background: 'linear-gradient(180deg,#241a33,#150f20)', borderLeft: '6px solid var(--gold2)', borderBottom: D ? 'none' : '6px solid var(--gold2)' });
  el('corner', { left: '1632px', top: '14px', fontSize: '56px', lineHeight: '1.1' }, '東風戦<br>東一局');
  const rows = [['F1', 'メニュー', '', '#1d4ea8'], ['F2', '先生', 'なし', '#1b7a3a'], ['F3', '見送り', '自動OFF', '#c25a00'], ['F4', '並べ替え', '自動', '#6a2fb0'], ['F5', 'せってい', '', '#505050']];
  rows.forEach((r, i) => {
    const PI = D ? 150 : 132, RH = D ? 140 : 124, y = 140 + i * PI;
    el('abs', { left: '1612px', top: y + 'px', width: '296px', height: RH + 'px', background: r[3], border: '5px solid #fff', borderRadius: '20px', boxShadow: '0 6px 0 #0006' });
    el('abs', { left: '1626px', top: (y + (RH - 88) / 2) + 'px', width: '88px', height: '88px', background: '#fff', color: '#111', borderRadius: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '46px', fontWeight: '900' }, r[0]);
    el('abs', { left: '1726px', top: y + 'px', width: '176px', height: RH + 'px', color: '#fff', fontWeight: '900', fontSize: '42px', lineHeight: '1.12', display: 'flex', flexDirection: 'column', justifyContent: 'center', textShadow: '0 3px 0 #0008' }, r[1] + (r[2] ? `<span style="margin-top:6px;align-self:flex-start;background:#fff;color:#111;border-radius:12px;padding:0 14px;font-size:30px;text-shadow:none">${r[2]}</span>` : ''));
  });
  if (D) el('corner', { left: '1624px', top: '910px', width: '280px', fontSize: '24px', lineHeight: '1.45', fontWeight: 700, color: '#d8ccf0', textShadow: 'none' }, 'キーボードの F1〜F5 でも押せます。<br>画面のボタンをクリックしてもOK。');
}

/* ---- ロン・ポンなどの呼び出し: その席のキャラクターを大きく出し、言葉を中央に向けて出す ---- */
const Q = new URLSearchParams(location.search);
const WORD = Q.get('w') || 'ロン', SEAT = Q.get('seat') || 'right';
const WCOL = { 'ロン': ['#ff4b3a', '#7a0d05'], 'ツモ': ['#ff4b3a', '#7a0d05'], 'ポン': ['#ffb21a', '#6b3b00'], 'チー': ['#3aa0ff', '#0a3a7a'], 'リーチ': ['#ff5fa0', '#7a0a3c'] }[WORD] || ['#ffb21a', '#6b3b00'];
if (EV) {
  el('abs', { left: '0', top: '0', width: W + 'px', height: '1080px', background: '#000a' });
  const A = { top: { f: [CX + 270, 30], w: [CX - 250, 40], who: ['ナオミ', 28] }, left: { f: [50, 300], w: [330, 250], who: ['ショウ', 34] }, right: { f: [W - 330, 300], w: [W - 830, 250], who: ['源造', 18] }, you: { f: [50, 560], w: [330, 520], who: ['あなた', 0] } }[SEAT];
  // 大きな顔(席の位置に)
  const fb = el('abs', { left: A.f[0] + 'px', top: A.f[1] + 'px', width: '280px', height: '280px', borderRadius: '30px', border: '8px solid var(--gold)', boxShadow: '0 0 0 6px var(--purple), 0 0 50px 12px ' + WCOL[0] + 'aa', background: A.who[1] ? face(A.who[1]) + ' center/cover' : '#4a3a6a' });
  if (!A.who[1]) fb.innerHTML = '<div style="color:#fff;font-size:44px;font-weight:900;text-align:center;line-height:280px">あなた</div>';
  el('plate', { position: 'absolute', left: (A.f[0] + 20) + 'px', top: (A.f[1] + 292) + 'px', minWidth: '240px' }, `<b style="font-size:38px">${A.who[0]}</b>`);
  // 大きな言葉(ふち取り)
  el('abs', { left: A.w[0] + 'px', top: A.w[1] + 'px', fontSize: '180px', fontWeight: '900', lineHeight: '1', color: WCOL[0], letterSpacing: '.04em', WebkitTextStroke: '9px #fff', paintOrder: 'stroke fill', textShadow: '0 8px 0 ' + WCOL[1] + ', 0 14px 22px #000' }, WORD + '!');
  if (WORD === 'ロン') {
    // あたり牌を光らせ、矢印でつなぐ
    el('abs', { left: (CX + 100) + 'px', top: '640px', width: '74px', height: '94px', border: '6px solid #ffd23f', borderRadius: '12px', boxShadow: '0 0 30px 10px #ffd23f' });
    el('abs', { left: (CX + 190) + 'px', top: '660px', fontSize: '34px', fontWeight: '900', color: '#ffe066', textShadow: '0 3px 6px #000' }, '← このあたり牌');
  }
  el('abs', { left: (CX - 260) + 'px', top: '840px', width: '520px', textAlign: 'center', fontSize: '34px', color: '#fff', fontWeight: 800, textShadow: '0 3px 6px #000' }, 'クリック か Enter で つぎへ');
}
/* ---- 局の結果: 4人の札を、それぞれの席の位置に ---- */
if (RS) {
  el('abs', { left: '0', top: '0', width: W + 'px', height: '1080px', background: '#000a' });
  const P = [
    { pos: [CX - 250, 18], rank: 2, name: 'ショウ', n: 34, d: ['±0'], tot: '25,000' },
    { pos: [24, 330], rank: 3, name: 'ナオミ', n: 28, d: ['±0'], tot: '25,000' },
    { pos: [W - 524, 330], rank: 1, name: '源造', n: 18, d: ['+3,900'], tot: '28,900', win: 'ロン 2飜30符' },
    { pos: [CX - 250, 600], rank: 4, name: 'あなた', n: 0, d: ['−3,900'], tot: '21,100' },
  ];
  const ch = (par, style, html) => { const d = document.createElement('div'); d.style.position = 'absolute'; Object.assign(d.style, style); d.innerHTML = html || ''; par.appendChild(d); return d; };
  P.forEach((q) => {
    const c = el('abs', { left: q.pos[0] + 'px', top: q.pos[1] + 'px', width: '500px', height: '230px', background: 'linear-gradient(180deg,#3a1d60,#1e0f36)', border: q.win ? '6px solid #ffd23f' : '5px solid #b57a0b', borderRadius: '22px', boxShadow: q.win ? '0 0 40px 8px #ffd23f88' : '0 8px 18px #000a', color: '#fff' });
    ch(c, { left: '18px', top: '6px', fontSize: '60px', fontWeight: '900', color: q.rank === 1 ? '#ffd23f' : '#fff' }, q.rank + '<span style="font-size:36px">位</span>');
    ch(c, { left: '150px', top: '16px', fontSize: '46px', fontWeight: '900' }, q.name);
    const f = ch(c, { left: '18px', top: '78px', width: '134px', height: '134px', borderRadius: '16px', border: '5px solid #ffd23f', background: q.n ? face(q.n) + ' center/cover' : '#4a3a6a' }); if (!q.n) f.innerHTML = '<div style="font-size:30px;font-weight:900;text-align:center;line-height:124px">あなた</div>';
    ch(c, { right: '24px', top: '66px', textAlign: 'right', fontSize: '52px', fontWeight: '900', color: q.d[0][0] === '+' ? '#ffd23f' : q.d[0][0] === '−' ? '#ff9a90' : '#ddd' }, q.d[0]);
    ch(c, { right: '24px', top: '128px', textAlign: 'right', fontSize: '70px', fontWeight: '900' }, q.tot);
    if (q.win) ch(c, { left: '262px', top: '20px', fontSize: '30px', fontWeight: '900', color: '#111', background: '#ffd23f', borderRadius: '12px', padding: '2px 14px' }, q.win);
  });
  el('btn', { left: (CX - 250) + 'px', top: '850px', width: '500px', height: '96px', fontSize: '46px', background: 'linear-gradient(180deg,#ffd45c,#e69a10)' }, 'つぎの きょくへ');
}
</script>
</body></html>
