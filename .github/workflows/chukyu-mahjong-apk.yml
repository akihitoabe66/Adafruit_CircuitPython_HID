name: Chukyu Mahjong APK (Android / Fire TV)

# GitHub の「Actions」タブ → このワークフロー → 「Run workflow」で手動実行できます。
# 完了後、実行結果ページの「Artifacts」から chukyu-mahjong-apk をダウンロードしてください。
on:
  workflow_dispatch:
  push:
    tags: ['chukyu-apk-*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web assets
        working-directory: chukyu-mahjong
        run: |
          rm -rf android-app/www android-app/android
          mkdir -p android-app/www
          cp -r index.html style.css js img audio android-app/www/

      - name: Capacitor (create Android project)
        working-directory: chukyu-mahjong/android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          pip install pillow
          python3 patch_android.py .
          npx cap sync android

      - name: Build debug APK
        working-directory: chukyu-mahjong/android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chukyu-mahjong-apk
          path: chukyu-mahjong/android-app/android/app/build/outputs/apk/debug/app-debug.apk
