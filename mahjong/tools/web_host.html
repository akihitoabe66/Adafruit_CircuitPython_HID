<title>麻雀 Pi版シミュレーター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
  /* 単一の暗い画面(ゲーム機ふう)。緑の卓に合わせた、緑みのある黒を地にする */
  :root { --bg: #0c1a14; --panel: #15281f; --edge: #2c4a3b; --fg: #e6efe8; --dim: #9db3a5; --key: #25402f; --key-hi: #36604a; --gold: #f1c84b; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Noto Sans JP", system-ui, sans-serif; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 18px; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .top h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .04em; }
  .tune { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
  .tune select { background: var(--panel); color: var(--fg); border: 1px solid var(--edge); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .screen { position: relative; width: 100%; aspect-ratio: 832 / 468; background: #000; border: 2px solid var(--edge); border-radius: 6px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .msg[hidden], .stat[hidden] { display: none; }
  .stat { position: absolute; left: 6px; bottom: 4px; font: 11px/1.3 ui-monospace, Menlo, monospace; color: #7dffa8; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 3px; pointer-events: none; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; background: rgba(6,16,11,.92); color: var(--fg); padding: 20px; }
  .pad { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(3, 62px); gap: 6px; }
  .btn { background: var(--key); color: var(--fg); border: 1px solid var(--edge); border-radius: 10px; font: 700 16px "Noto Sans JP", sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .btn:active, .btn.on { background: var(--key-hi); border-color: var(--gold); }
  .ab { display: flex; gap: 12px; align-items: center; }
  .ab .btn { width: 86px; height: 86px; border-radius: 50%; font-size: 17px; }
  .ab .ok { background: #2f5a9a; border-color: #5b8bd0; }
  .ab .bk { background: #5a4a30; border-color: #a38c58; }
  .sub { display: flex; justify-content: center; gap: 10px; }
  .sub .btn { padding: 8px 16px; font-size: 13px; font-weight: 500; }
  .note { color: var(--dim); font-size: 12px; margin: 0; }
  @media (max-width: 460px) { .dpad { grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); } .ab .btn { width: 72px; height: 72px; } }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

<div class="wrap">
  <div class="top">
    <h1>麻雀 Pi版シミュレーター(音なし)</h1>
    <label class="tune">Pi Zeroの遅さ
      <select id="slow">
        <option value="1">なし(×1)</option>
        <option value="5">×5</option>
        <option value="10" selected>×10(目安)</option>
        <option value="20">×20</option>
        <option value="30">×30</option>
      </select>
    </label>
  </div>
  <div class="screen" id="screen">
    <canvas id="cv" width="1664" height="936"></canvas>
    <div class="stat" id="stat" hidden></div>
    <div class="msg" id="msg">読み込み中…</div>
  </div>
  <div class="pad">
    <div class="dpad">
      <span></span><button class="btn" data-k="up" aria-label="上">▲</button><span></span>
      <button class="btn" data-k="left" aria-label="左">◀</button><span></span><button class="btn" data-k="right" aria-label="右">▶</button>
      <span></span><button class="btn" data-k="down" aria-label="下">▼</button><span></span>
    </div>
    <div class="ab">
      <button class="btn bk" data-k="back">戻る</button>
      <button class="btn ok" data-k="ok">決定</button>
    </div>
  </div>
  <div class="sub">
    <button class="btn" data-k="menu">メニュー</button>
    <button class="btn" id="statBtn">処理時間を表示</button>
  </div>
  <p class="note">実機のPi Zero W(CPU 1コア)の遅さを、処理時間を「×N」して待つことで真似ています。画面の描画(GPU)や音は再現しません。キーボードの矢印・Enter・Escでも操作できます。</p>
</div>

<script src="bundle.js"></script>
<script>
(async function () {
  'use strict';
  const W = 832, H = 468;
  const $ = (id) => document.getElementById(id);
  const msg = $('msg'), vcv = $('cv'), vctx = vcv.getContext('2d');
  const showMsg = (t) => { msg.hidden = false; msg.textContent = t; };
  /* ---------- 保存(localStorage が使えなければ、メモリ) ---------- */
  const mem = {};
  const sget = (k) => { try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : null) : v; } catch (e) { return k in mem ? mem[k] : null; } };
  const sset = (k, v) => { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
  const sdel = (k) => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };
  const slotKeys = () => { const ks = new Set(Object.keys(mem)); try { for (let i = 0; i < localStorage.length; i++) ks.add(localStorage.key(i)); } catch (e) { /* ignore */ } return [...ks].filter((k) => /^mjpi_slot_\d+$/.test(k)).map((k) => +k.slice(10)).sort((a, b) => b - a); };

  /* ---------- 画像・フォント ---------- */
  showMsg('画像を読み込み中…');
  let assets = {}, chars = '';
  try { assets = await (await fetch('assets.json')).json(); chars = await (await fetch('chars.txt')).text(); } catch (e) { showMsg('読み込みに失敗しました: ' + e); return; }
  const imgs = {};
  await Promise.all(Object.keys(assets).map((k) => new Promise((res) => { const im = new Image(); im.onload = () => { imgs[k] = im; res(); }; im.onerror = () => res(); im.src = assets[k]; })));
  assets = null;
  showMsg('文字を読み込み中…');
  const FONT = '"Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif';
  try { await Promise.race([Promise.all([document.fonts.load('500 20px "Noto Sans JP"', chars + '0123456789'), document.fonts.load('700 20px "Noto Sans JP"', chars)]), new Promise((r) => setTimeout(r, 6000))]); } catch (e) { /* ignore */ }

  /* ---------- 描画の道具(gfx): Pi版の C 側と同じ約束を、Canvas で ---------- */
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const tgt = mk(), lay = [];
  let ctx = tgt.getContext('2d'), tctx = ctx;
  let vx = 0, vy = 0, tops = [], forceDraw = true; const sil = {};
  const rgba = (r, g, b, a) => 'rgba(' + r + ',' + g + ',' + b + ',' + (a == null ? 1 : a / 255) + ')';
  const applyView = () => { ctx.restore(); ctx.save(); ctx.beginPath(); ctx.rect(vx, vy, W - vx, H - vy); ctx.clip(); ctx.translate(vx, vy); };
  const setFont = (sz) => { ctx.font = '500 ' + sz + 'px ' + FONT; };
  const gfx = {
    fill(x, y, w, h, r, g, b, a) { ctx.fillStyle = rgba(r, g, b, a === undefined ? 255 : a); ctx.fillRect(x, y, w, h); },
    frame(x, y, w, h, r, g, b, t) { t = t || 1; ctx.fillStyle = rgba(r, g, b, 255); for (let i = 0; i < t; i++) { const ww = w - 2 * i, hh = h - 2 * i; if (ww <= 0 || hh <= 0) break; ctx.fillRect(x + i, y + i, ww, 1); ctx.fillRect(x + i, y + i + hh - 1, ww, 1); ctx.fillRect(x + i, y + i + 1, 1, hh - 2); ctx.fillRect(x + i + ww - 1, y + i + 1, 1, hh - 2); } },
    image(p, x, y, w, h, a) { const im = imgs[p]; if (!im) return false; ctx.globalAlpha = a == null ? 1 : a / 255; ctx.drawImage(im, x, y, w, h); ctx.globalAlpha = 1; return true; },
    imageRot(p, x, y, w, h, a, ang) { const im = imgs[p]; if (!im) return false; const sw = ang === 90 || ang === 270; const bw = sw ? h : w, bh = sw ? w : h; ctx.save(); ctx.globalAlpha = a == null ? 1 : a / 255; ctx.translate(x + bw / 2, y + bh / 2); ctx.rotate(ang * Math.PI / 180); ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore(); return true; },
    imageSil(p, x, y, w, h, a) { const im = imgs[p]; if (!im) return false; let sc = sil[p]; if (!sc) { sc = document.createElement('canvas'); sc.width = im.naturalWidth; sc.height = im.naturalHeight; const c = sc.getContext('2d'); c.drawImage(im, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = 'rgb(255,222,70)'; c.fillRect(0, 0, sc.width, sc.height); sil[p] = sc; } ctx.globalAlpha = a == null ? 1 : a / 255; ctx.drawImage(sc, x, y, w, h); ctx.globalAlpha = 1; return true; },
    fillTop(x, y, w, h, r, g, b, a) { tops.push({ k: 'rect', x: x + vx, y: y + vy, w, h, c: rgba(r, g, b, a === undefined ? 255 : a) }); },
    textTop(s, x, y, sz, r, g, b, al) { if (s === '' || s == null) return 0; s = String(s); setFont(sz); const w = Math.round(ctx.measureText(s).width); if (al === 1) x -= Math.round(w / 2); else if (al === 2) x -= w; tops.push({ k: 'text', s, x: x + vx, y: y + vy, sz, c: rgba(r, g, b, 255) }); return w; },
    imageTop(p, x, y, w, h) { const im = imgs[p]; if (!im) return false; const iw = im.naturalWidth, ih = im.naturalHeight; let sx = 0, sy = 0, sw = iw, sh = ih; if (w * ih > h * iw) sh = iw * h / w; else if (w * ih < h * iw) { sw = ih * w / h; sx = (iw - sw) / 2; } tops.push({ im, sx, sy, sw, sh, x: x + vx, y: y + vy, w, h }); return true; },
    text(s, x, y, sz, r, g, b, al) { if (s === '' || s == null) return 0; s = String(s); setFont(sz); const w = Math.round(ctx.measureText(s).width); if (al === 1) x -= Math.round(w / 2); else if (al === 2) x -= w; ctx.fillStyle = rgba(r, g, b, 255); ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y + sz * 0.86); return w; },
    textRot(s, cx, cy, sz, r, g, b, ang) { if (s === '' || s == null) return 0; s = String(s); setFont(sz); const w = Math.round(ctx.measureText(s).width); ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang * Math.PI / 180); ctx.fillStyle = rgba(r, g, b, 255); ctx.textBaseline = 'alphabetic'; ctx.fillText(s, -w / 2, sz * 0.37); ctx.restore(); return w; },
    measure(s, sz) { tctx.font = '500 ' + sz + 'px ' + FONT; return Math.round(tctx.measureText(String(s)).width); },
    clear(r, g, b) { ctx.restore(); ctx.save(); ctx.fillStyle = rgba(r, g, b, 255); ctx.fillRect(0, 0, W, H); applyView(); },
    present() {}, shot() {},
    view(x, y) { vx = x; vy = y; applyView(); },
    clip(x, y, w, h) { ctx.restore(); ctx.save(); ctx.beginPath(); if (arguments.length < 4) ctx.rect(vx, vy, W - vx, H - vy); else ctx.rect(x + vx, y + vy, w, h); ctx.clip(); ctx.translate(vx, vy); },
    layerBegin(i) { if (i < 0 || i >= 6) return; if (!lay[i]) lay[i] = mk(); const c = lay[i].getContext('2d'); ctx.restore(); ctx = c; ctx.clearRect(0, 0, W, H); ctx.save(); },
    layerEnd() { ctx.restore(); ctx = tctx; ctx.save(); applyView(); },
    layer(i) { if (i < 0 || i >= 6 || !lay[i]) return; ctx.drawImage(lay[i], 0, 0); },
  };
  /* gfx.measure は、描画先と別でも同じ答えになるよう tctx を使う(layerBegin中も使える) */
  const noop = () => {};
  const snd = { play: noop, len: () => 0, stopAll: noop, music: noop, musicVol: noop };

  /* ---------- 通常形のシャンテン数(C版 shanten.h と同じ答え) ---------- */
  const tabs = [new Map(), new Map()];
  function shRec(a, n, num, i, m, t, j, mask) {
    while (i < n && a[i] === 0) i++;
    if (m > 4) return;
    if (i >= n) { mask[m * 10 + (t > 4 ? 4 : t) * 2 + j] = 1; return; }
    if (a[i] >= 3) { a[i] -= 3; shRec(a, n, num, i, m + 1, t, j, mask); a[i] += 3; }
    if (num && i <= n - 3 && a[i + 1] > 0 && a[i + 2] > 0) { a[i]--; a[i + 1]--; a[i + 2]--; shRec(a, n, num, i, m + 1, t, j, mask); a[i]++; a[i + 1]++; a[i + 2]++; }
    if (a[i] >= 2) { if (!j) { a[i] -= 2; shRec(a, n, num, i, m, t, 1, mask); a[i] += 2; } a[i] -= 2; shRec(a, n, num, i, m, t + 1, j, mask); a[i] += 2; }
    if (num && i <= n - 2 && a[i + 1] > 0) { a[i]--; a[i + 1]--; shRec(a, n, num, i, m, t + 1, j, mask); a[i]++; a[i + 1]++; }
    if (num && i <= n - 3 && a[i + 2] > 0) { a[i]--; a[i + 2]--; shRec(a, n, num, i, m, t + 1, j, mask); a[i]++; a[i + 2]++; }
    a[i]--; shRec(a, n, num, i, m, t, j, mask); a[i]++;
  }
  function shSuit(c, off, n, num) {
    const a = []; let key = 0; for (let i = 0; i < n; i++) { let v = c[off + i] | 0; if (v > 4) v = 4; a.push(v); key = key * 5 + v; }
    const tab = tabs[num ? 0 : 1]; let r = tab.get(key); if (r) return r;
    r = new Uint8Array(50); shRec(a, n, num, 0, 0, 0, 0, r); tab.set(key, r); return r;
  }
  function shStd(c, f) {
    let cur = new Uint8Array(50); cur[(f > 4 ? 4 : f) * 10] = 1; const OFF = [0, 9, 18, 27], N = [9, 9, 9, 7];
    for (let p = 0; p < 4; p++) {
      const cs = shSuit(c, OFF[p], N[p], p < 3), nx = new Uint8Array(50);
      for (let s = 0; s < 50; s++) { if (!cur[s]) continue; const m0 = (s / 10) | 0, t0 = (s % 10) >> 1, j0 = s & 1;
        for (let q = 0; q < 50; q++) { if (!cs[q]) continue; const j1 = q & 1, m1 = (q / 10) | 0, t1 = (q % 10) >> 1; if (j0 && j1) continue; const m = m0 + m1; if (m > 4) continue; let t = t0 + t1; if (t > 4) t = 4; nx[m * 10 + t * 2 + (j0 | j1)] = 1; } }
      cur = nx;
    }
    let best = 8; for (let s = 0; s < 50; s++) { if (!cur[s]) continue; const m = (s / 10) | 0, t = (s % 10) >> 1, j = s & 1, tt = t < 4 - m ? t : 4 - m, sh = 8 - 2 * m - tt - j; if (sh < best) best = sh; }
    return best;
  }

  /* ---------- ゲームを起動 ---------- */
  const quit = () => showMsg('終了しました。ページを読み込み直すと、また始められます。');
  window.__auto = false;
  try { if (new URLSearchParams(location.search).get('you') === 'old') window.__youEnv = 'old'; } catch (e) { /* ignore */ } // ?you=old で、前の「あなた」の絵
  window.__mjBundle(gfx, snd, (...a) => console.log(...a), () => performance.now(),
    () => sget('mjpi_save'), (s) => sset('mjpi_save', s), noop, quit, () => '',
    slotKeys, (n) => sget('mjpi_slot_' + n), (n, s) => { sset('mjpi_slot_' + n, s); return true; }, (n) => sdel('mjpi_slot_' + n),
    (c, f) => shStd(c, f));
  msg.hidden = true;

  /* ---------- 画面に出す ---------- */
  function present() {
    const sx = vcv.width / W, sy = vcv.height / H;
    vctx.imageSmoothingEnabled = true; vctx.imageSmoothingQuality = 'high';
    vctx.drawImage(tgt, 0, 0, vcv.width, vcv.height);
    for (const t of tops) {
      if (t.k === 'rect') { vctx.fillStyle = t.c; vctx.fillRect(t.x * sx, t.y * sy, t.w * sx, t.h * sy); }
      else if (t.k === 'text') { vctx.font = '500 ' + (t.sz * sx) + 'px ' + FONT; vctx.fillStyle = t.c; vctx.textBaseline = 'alphabetic'; vctx.fillText(t.s, t.x * sx, (t.y + t.sz * 0.86) * sy); }
      else vctx.drawImage(t.im, t.sx, t.sy, t.sw, t.sh, t.x * sx, t.y * sy, t.w * sx, t.h * sy);
    }
  }
  const spin = (ms) => { if (ms < 0.5) return; const e = performance.now() + Math.min(ms, 1500); while (performance.now() < e) { /* 遅いCPUを真似て、待つ */ } };
  const flush = () => new Promise((r) => queueMicrotask(() => queueMicrotask(r)));
  let slow = 10, showStat = false, sMax = 0, sDraw = 0, sDn = 0, lastStat = 0;
  $('slow').addEventListener('change', (e) => { slow = +e.target.value; });
  $('statBtn').addEventListener('click', () => { showStat = !showStat; $('stat').hidden = !showStat; $('statBtn').classList.toggle('on', showStat); });
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { forceDraw = true; });

  async function tick() {
    const a = performance.now();
    let need = false;
    try { need = window.__frame(a); } catch (e) { console.error(e); }
    await flush();
    const dl = performance.now() - a; spin((slow - 1) * dl);
    let dd = 0;
    if (need || forceDraw) {
      forceDraw = false; const b = performance.now();
      ctx = tctx; tops = []; ctx.save(); vx = 0; vy = 0;
      ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
      try { window.__draw(); } catch (e) { console.error(e); }
      ctx.restore(); present();
      dd = performance.now() - b; spin((slow - 1) * dd);
    }
    if (dl > sMax) sMax = dl; if (dd) { sDraw += dd; sDn++; }
    const now = performance.now();
    if (showStat && now - lastStat > 1000) { $('stat').textContent = '1回の処理 最大 ' + sMax.toFixed(0) + 'ms → Pi換算 ' + (sMax * slow).toFixed(0) + 'ms ／ 描画 ' + (sDn ? (sDraw / sDn).toFixed(1) : '0') + 'ms → ' + (sDn ? (sDraw / sDn * slow).toFixed(0) : '0') + 'ms'; sMax = sDraw = sDn = 0; lastStat = now; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- 操作 ---------- */
  const key = (k) => { try { window.__key(k); } catch (e) { console.error(e); } };
  document.querySelectorAll('[data-k]').forEach((b) => {
    let t = 0;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); key(b.dataset.k); const k = b.dataset.k; if (k === 'ok' || k === 'back' || k === 'menu') return; clearTimeout(t); t = setTimeout(function rep() { key(k); t = setTimeout(rep, 110); }, 380); });
    const stop = () => clearTimeout(t); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  });
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Enter: 'ok', ' ': 'ok', z: 'ok', Escape: 'back', Backspace: 'back', x: 'back' };
  document.addEventListener('keydown', (e) => { const k = KEYS[e.key]; if (k) { e.preventDefault(); key(k); } });
})();
</script>
